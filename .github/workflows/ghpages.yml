name: "Update Editor's Copy"

on:
  push:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .gitignore
  pull_request:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - LICENSE.md
      - .gitignore

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: "Build Drafts"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1.307.0
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: "Install xml2rfc"
        run: pip install xml2rfc

      - name: "Cache xml2rfc References"
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .refcache
          key: refcache-${{ hashFiles('draft-*.md') }}
          restore-keys: refcache-

      - name: "Build Drafts"
        run: make

      - name: "Prepare Pages"
        if: github.event_name == 'push'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p _site
          cp -f draft-*.html draft-*.txt _site/
          touch _site/.nojekyll
          # Generate a simple index page
          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>ipfeed Internet-Draft</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 4em auto; padding: 0 1em; }
              a { color: #2a6496; }
              h1 { font-size: 1.4em; }
              ul { line-height: 2; }
            </style>
          </head>
          <body>
            <h1>ipfeed: Self-Published IP Network Metadata Format</h1>
            <ul>
          EOF
          for f in draft-*.html; do
            base="${f%.html}"
            echo "    <li><a href=\"$f\">${base}</a> (<a href=\"${base}.txt\">txt</a>)</li>" >> _site/index.html
          done
          cat >> _site/index.html <<EOF
            </ul>
            <p><a href="https://github.com/${GH_REPO}">Source repository</a> ·
               <a href="https://github.com/${GH_REPO}/issues">Issues</a></p>
          </body>
          </html>
          EOF

      - name: "Publish to gh-pages"
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
